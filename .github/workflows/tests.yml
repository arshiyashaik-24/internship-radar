# Runs the automated tests whenever code changes, so a broken edit is caught
# before the next daily refresh.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['scripts/**', 'site/**', 'tests/**', 'config/**', 'package.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check the config files are valid JSON
        run: for f in config/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::Not valid JSON"; exit 1; }; done
